<!DOCTYPE html>
<html lang="en">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">

  <title>Contact & Support — Reviewwo QR</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2—family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="min-height: 100vh; display:flex; flex-direction:column; background:#F8FFFE;">

    <!-- World-Class Header -->
  <header class="site-header">
    <div class="nav-container">
      <a href="../index.html" class="nav-brand-link">
        <img src="../assets/img/logo.svg" alt="Reviewwo QR" class="nav-brand-logo">
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-menu-list">
          <li class="nav-menu-item"><a href="features.html">Features</a></li>
          <li class="nav-menu-item"><a href="features.html#whatsapp-shield"><i class="fa-brands fa-whatsapp" style="color:#10B981;"></i> WhatsApp Shield</a></li>
          <li class="nav-menu-item"><a href="pricing.html">Pricing <span class="nav-badge-price">₹149/mo</span></a></li>
          <li class="nav-menu-item"><a href="agency.html">Agency Hub</a></li>
          <li class="nav-menu-item"><a href="dashboard.html"><span class="nav-status-dot"></span> Live Console</a></li>
        </ul>
      </nav>

      <div class="nav-actions-group">
        <a href="login.html" class="nav-btn-signin">Sign In</a>
        <a href="register.html" class="nav-btn-cta"><i class="fa-solid fa-bolt"></i> Start Free Trial</a>
      </div>
    </div>
  </header>

  <main class="section" style="flex:1; padding-top:4rem;">
    <div class="container" style="max-width:860px;">
      <div style="text-align:center; margin-bottom:3rem;">
        <span class="hero-badge" style="display:inline-block; margin-bottom:12px;">HELP & INQUIRIES</span>
        <h1 style="font-size:2.5rem; font-weight:800; color:#0B3D3B;">Get In Touch With Reviewwo QR</h1>
        <p style="color:#4A706E;">Have questions about setting up your smart QR standees, connecting Google API, or agency licenses— Reach us anytime.</p>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2.5rem;">
        <!-- Contact Form -->
        <div class="card" style="padding:2rem;">
          <h3 style="color:#0B3D3B; margin-bottom:16px;">Send Us A Message</h3>
          <form id="contact-form">
            <div style="margin-bottom:14px;">
              <label style="display:block; font-size:13px; font-weight:700; color:#0B3D3B; margin-bottom:4px;">Your Name</label>
              <input type="text" class="audit-input" style="width:100%;" required>
            </div>
            <div style="margin-bottom:14px;">
              <label style="display:block; font-size:13px; font-weight:700; color:#0B3D3B; margin-bottom:4px;">Email Address</label>
              <input type="email" class="audit-input" style="width:100%;" required>
            </div>
            <div style="margin-bottom:14px;">
              <label style="display:block; font-size:13px; font-weight:700; color:#0B3D3B; margin-bottom:4px;">Message</label>
              <textarea class="audit-input" style="width:100%; height:110px; resize:none;" placeholder="How can we assist your business— required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>

        <!-- Direct Channels -->
        <div style="display:flex; flex-direction:column; gap:16px; justify-content:center;">
          <div class="card" style="padding:1.5rem;">
            <div style="display:flex; align-items:center; gap:14px;">
              <div style="width:44px; height:44px; border-radius:12px; background:#E6FFFB; color:#14B8A6; display:flex; align-items:center; justify-content:center; font-size:20px;"><i class="fa-solid fa-envelope"></i></div>
              <div>
                <h4 style="margin:0; font-size:15px; color:#0B3D3B;">Email Support</h4>
                <a href="mailto:support@reviewwoqr.com" style="color:#14B8A6; font-size:14px; text-decoration:none; font-weight:700;">support@reviewwoqr.com</a>
              </div>
            </div>
          </div>

          <div class="card" style="padding:1.5rem;">
            <div style="display:flex; align-items:center; gap:14px;">
              <div style="width:44px; height:44px; border-radius:12px; background:#E6FFFB; color:#25D366; display:flex; align-items:center; justify-content:center; font-size:20px;"><i class="fa-brands fa-whatsapp"></i></div>
              <div>
                <h4 style="margin:0; font-size:15px; color:#0B3D3B;">WhatsApp Concierge</h4>
                <a href="https://wa.me/919999999999" style="color:#14B8A6; font-size:14px; text-decoration:none; font-weight:700;">+91 99999 99999 (Instant Chat)</a>
              </div>
            </div>
          </div>

          <div class="card" style="padding:1.5rem; background:#E6FFFB; border-color:#99F6E4;">
            <h4 style="color:#0B3D3B; font-size:14px; margin-bottom:6px;"><i class="fa-solid fa-clock"></i> Response Times</h4>
            <p style="color:#4A706E; font-size:13px; margin:0; line-height:1.5;">
              WhatsApp support is available 7 days a week, 9 AM – 9 PM IST. Email queries are typically answered within 2 hours.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" style="background:#051C1B; color:#99F6E4; padding:2rem 0; text-align:center;">
    <p style="color:#6B9896; font-size:13px; margin:0;">&copy; 2026 Reviewwo QR. All rights reserved.</p>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      window.showToast('Thank you! Your message has been routed to our support team.');
      this.reset();
    });
  </script>
</body>
</html>
