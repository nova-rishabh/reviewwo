<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Free Trial — Reviewwo QR (From ₹149/mo)</title>
  <meta name="description" content="Start your 3-day free trial of Reviewwo QR. Turn physical foot traffic into verified 5-star Google reviews.">
  <link rel="canonical" href="https://reviewwoqr.com/pages/register.html">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: #F8FFFE;">

  <!-- Header -->
  <header class="navbar" style="background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(11, 61, 59, 0.08); height: 72px;">
    <div class="container navbar-container" style="display: flex; align-items: center; justify-content: space-between; height: 100%;">
      <a href="../index.html" class="nav-brand" aria-label="Reviewwo QR Home" style="display: flex; align-items: center;">
        <img src="../assets/img/logo.svg" alt="Reviewwo QR" style="height: 38px; width: auto;">
      </a>

      <div class="nav-actions" style="display: flex; align-items: center; gap: 14px;">
        <span style="font-size: 13px; color: #4A706E;">Already have an account?</span>
        <a href="login.html" class="btn btn-secondary btn-sm" style="font-weight: 700; font-size: 13px; padding: 8px 16px;">
          Sign In
        </a>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="max-width: 520px; width: 100%; padding: 2.5rem; background: #FFFFFF; border: 1.5px solid #99F6E4; border-radius: 24px; box-shadow: 0 20px 50px rgba(11, 61, 59, 0.08);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge" style="background:#E6FFFB; color:#0B3D3B; border:1px solid #99F6E4; font-weight:800; font-size:11px;">3-DAY FREE TRIAL</span>
        <h2 style="font-size: 1.8rem; font-weight: 900; color: #0B3D3B; margin-top: 8px; margin-bottom: 4px;">Launch Reviewwo QR</h2>
        <p style="color: #4A706E; font-size: 13.5px; margin: 0;">Full access. No credit card required. Cancel anytime in 1 click.</p>
      </div>

      <div id="reg-error-banner" style="display: none; background: #FEE2E2; border: 1px solid #EF4444; color: #991B1B; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; margin-bottom: 18px;">
      </div>

      <form id="register-form">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div>
            <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">Your Full Name</label>
            <input type="text" id="reg-name" class="audit-input" style="width: 100%;" placeholder="e.g. Rahul Sharma" required>
          </div>
          <div>
            <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">Business Name</label>
            <input type="text" id="reg-business" class="audit-input" style="width: 100%;" placeholder="e.g. Copper Chimney Bistro" required>
          </div>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">Work Email Address</label>
          <input type="email" id="reg-email" class="audit-input" style="width: 100%;" placeholder="owner@business.com" required>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">Create Password</label>
          <input type="password" id="reg-password" class="audit-input" style="width: 100%;" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">WhatsApp Phone Number</label>
          <input type="tel" id="reg-phone" class="audit-input" style="width: 100%;" placeholder="+91 98765 43210" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label style="display:block; font-size: 13px; font-weight: 700; color: #0B3D3B; margin-bottom: 6px;">Select Subscription Plan</label>
          <select id="reg-plan" class="audit-input" style="width: 100%; font-size: 13px; padding: 10px;">
            <option value="growth" selected>Growth Plan (₹299/mo) — ⭐ Most Popular (Free Standee + Autopilot)</option>
            <option value="starter">Starter Plan (₹149/mo) — 1 Location (Dynamic QR + WhatsApp Shield)</option>
            <option value="agency">Agency Plan (₹799/mo) — 5 Locations (White-Label Portal)</option>
          </select>
        </div>

        <button type="submit" id="btn-register" class="btn btn-primary btn-block" style="margin-bottom: 12px; padding: 12px;">
          <i class="fa-solid fa-bolt"></i> Create Account & Launch Dashboard &rarr;
        </button>

        <p style="text-align: center; font-size: 12px; color: #6B9896; margin: 0;">
          By continuing, you agree to our Terms of Service and Privacy Policy.
        </p>
      </form>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const planParam = urlParams.get('plan');
    if (planParam && ['starter', 'growth', 'agency'].includes(planParam.toLowerCase())) {
      document.getElementById('reg-plan').value = planParam.toLowerCase();
    }

    function showRegError(msg) {
      const banner = document.getElementById('reg-error-banner');
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('reg-error-banner').style.display = 'none';

      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Initializing Account...';

      const name = document.getElementById('reg-name').value.trim();
      const businessName = document.getElementById('reg-business').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const plan = document.getElementById('reg-plan').value;

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, businessName, email, password, phone, plan })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('rw_token', data.token);
          localStorage.setItem('rw_user', JSON.stringify(data.user));
          window.showToast('Account initialized successfully! Redirecting...');
          setTimeout(() => {
            window.location.href = '../dashboard/index.html';
          }, 400);
        } else {
          showRegError(data.error || 'Failed to initialize account.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Create Account & Launch Dashboard &rarr;';
        }
      } catch (err) {
        showRegError('Network error connecting to registration server.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Create Account & Launch Dashboard &rarr;';
      }
    });
  </script>
</body>
</html>
